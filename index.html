<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/png" href="/logo.png" />
		<link rel="apple-touch-icon" href="/logo.png" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<meta
			name="description"
			content="Interactive open-source course for Three.js, WebGPU, and TSL. 53 lessons in Turkish and English."
		/>
		<title>Three.js WebGPU & TSL</title>
		<script>
			document.documentElement.classList.add("hareket")
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<section id="karsilama">
			<div class="karsilama-arka" aria-hidden="true"></div>
			<header class="karsilama-ust">
				<p class="marka">
					<img
						src="/logo.svg"
						alt=""
						width="32"
						height="32"
					/>
					<span class="marka-yazi">
						WebGPU<span class="marka-amp">&</span>TSL
					</span>
				</p>
				<!-- TR geçici kapalı
				<div
					class="dil-switch"
					role="group"
					aria-label="Language"
				>
					<span class="dil-gosterge" aria-hidden="true"></span>
					<button
						id="dil-tr"
						type="button"
						data-dil="tr"
					>
						TR
					</button>
					<button
						id="dil-en"
						type="button"
						data-dil="en"
					>
						EN
					</button>
				</div>
				-->
			</header>

			<div class="karsilama-orta">
				<div class="karsilama-govde">
					<p class="eyebrow" data-i18n="karsilamaEyebrow"></p>
					<h1 data-i18n="karsilamaBaslik"></h1>
					<p class="ozet" data-i18n="karsilamaOzet"></p>
					<ul class="ozellikler" id="ozellikler"></ul>
					<div class="karsilama-aksiyon">
						<button
							id="baslat"
							type="button"
							class="birincil"
							data-i18n="baslat"
						></button>
						<button
							id="devam"
							type="button"
							class="ikincil"
							hidden
							data-i18n="devam"
						></button>
					</div>
				</div>
				<aside class="karsilama-gorsel" aria-hidden="true">
					<div class="karsilama-gorsel-cerceve">
						<p class="karsilama-gorsel-ust">
							<span data-i18n="karsilamaOnizleme"></span>
							<span class="karsilama-gorsel-chip">20 △</span>
						</p>
						<div class="karsilama-gorsel-tuval">
							<canvas id="karsilama-tuval"></canvas>
						</div>
						<p class="karsilama-gorsel-alt">
							<span>CPU</span>
							<span>DRAW</span>
							<span>VERTEX</span>
							<span>TRIANGLE</span>
							<span>FRAGMENT</span>
						</p>
					</div>
				</aside>
			</div>
		</section>

		<canvas id="sahne" hidden></canvas>

		<div id="ilerleme" hidden aria-hidden="true">
			<div id="ilerleme-cubuk"></div>
		</div>

		<div id="uygulama" hidden>
			<header id="ust">
				<div class="ust-bar">
					<div class="ust-sol">
						<button
							id="anasayfa"
							type="button"
							class="ikon-dugme"
							data-i18n-aria="anasayfa"
						>
							<img
								src="/logo.svg"
								alt=""
								width="32"
								height="32"
							/>
						</button>
						<div class="baslik">
							<p id="ders-no"></p>
							<div class="baslik-metin">
								<h1 id="ders-baslik"></h1>
								<p id="ders-bolum"></p>
							</div>
							<p id="ders-adim"></p>
						</div>
					</div>
					<nav class="gezgin">
						<!-- TR geçici kapalı
						<div
							class="dil-switch kucuk"
							role="group"
							aria-label="Language"
						>
							<span
								class="dil-gosterge"
								aria-hidden="true"
							></span>
							<button type="button" data-dil="tr">
								TR
							</button>
							<button type="button" data-dil="en">
								EN
							</button>
						</div>
						-->
						<div class="gezgin-ders">
							<button
								id="onceki"
								type="button"
								class="ikon-dugme"
								data-i18n-aria="onceki"
							>
								<svg
									viewBox="0 0 24 24"
									width="16"
									height="16"
									aria-hidden="true"
								>
									<path
										d="M14.5 6.5 8.5 12l6 5.5"
										fill="none"
										stroke="currentColor"
										stroke-width="1.8"
										stroke-linecap="round"
										stroke-linejoin="round"
									/>
								</svg>
							</button>
							<div class="ders-sec-kutu">
								<select
									id="ders-sec"
									data-i18n-aria="dersSec"
								></select>
								<span
									class="ders-sec-ok"
									aria-hidden="true"
								>
									<svg
										viewBox="0 0 12 12"
										width="12"
										height="12"
									>
										<path
											d="M2.2 4.4 L6 8.2 L9.8 4.4"
											fill="none"
											stroke="currentColor"
											stroke-width="1.5"
											stroke-linecap="round"
											stroke-linejoin="round"
										/>
									</svg>
								</span>
							</div>
							<button
								id="sonraki"
								type="button"
								class="ikon-dugme"
								data-i18n-aria="sonraki"
							>
								<svg
									viewBox="0 0 24 24"
									width="16"
									height="16"
									aria-hidden="true"
								>
									<path
										d="M9.5 6.5 15.5 12l-6 5.5"
										fill="none"
										stroke="currentColor"
										stroke-width="1.8"
										stroke-linecap="round"
										stroke-linejoin="round"
									/>
								</svg>
							</button>
						</div>
						<button
							id="notlar-ac"
							type="button"
							class="notlar-dugme"
							data-i18n="notlar"
						></button>
					</nav>
				</div>
			</header>

			<aside id="hud">
				<p class="panel-etiket" data-i18n="hudEtiket"></p>
				<p id="akis" class="akis"></p>
				<dl>
					<div>
						<dt>Backend</dt>
						<dd id="backend">…</dd>
					</div>
					<div>
						<dt>navigator.gpu</dt>
						<dd id="webgpu-destek">…</dd>
					</div>
					<div><dt>FPS</dt><dd id="fps">0</dd></div>
					<div>
						<dt data-i18n="kare">Frame</dt>
						<dd id="frame-ms">0</dd>
					</div>
					<div>
						<dt>drawCalls</dt>
						<dd id="draw-calls">0</dd>
					</div>
					<div>
						<dt>triangles</dt>
						<dd id="triangles">0</dd>
					</div>
					<div>
						<dt>points</dt>
						<dd id="points">0</dd>
					</div>
					<div>
						<dt>lines</dt>
						<dd id="lines">0</dd>
					</div>
					<div>
						<dt>geometries</dt>
						<dd id="geometries">0</dd>
					</div>
					<div>
						<dt>textures</dt>
						<dd id="textures">0</dd>
					</div>
					<div>
						<dt>compute</dt>
						<dd id="compute-calls">0</dd>
					</div>
				</dl>
				<div id="istatistik-ek"></div>
				<div id="kontroller"></div>
			</aside>

			<article id="notlar">
				<header class="notlar-ust">
					<p data-i18n="notlar"></p>
					<button
						id="notlar-kapat"
						type="button"
						data-i18n="notlarKapat"
					></button>
				</header>
				<div id="notlar-icerik"></div>
			</article>
		</div>

		<p id="hata" hidden></p>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
